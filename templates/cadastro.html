<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Controle Financeiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

    <!-- Botão Fixo no Canto Superior Direito -->
    <button id="toggle-theme" class="btn-theme-toggle" type="button">🌙 Modo Escuro</button>

    <div class="auth-container">
        <h2>Criar Nova Conta</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" required>
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>

        <p class="auth-footer">
            Já tem uma conta? <a href="{{ url_for('login') }}">Faça login aqui</a>
        </p>
    </div>

    <!-- Script com prevenção de Flicker -->
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const themeBtn = document.getElementById('toggle-theme');
            if (themeBtn && document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = '☀️ Modo Claro';
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    const isDark = document.body.classList.contains('dark-mode');
                    themeBtn.textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                });
            }
        });
    </script>
</body>
</html>
