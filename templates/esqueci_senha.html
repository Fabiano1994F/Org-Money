<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Org Money</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Org Money" class="auth-logo" style="max-width: 120px; margin: 0 auto 15px auto; display: block; border-radius: 12px;">
        <h2>🔒 Recuperar Senha</h2>
        <p style="text-align: center; color: #a0aec0; margin-bottom: 20px;">Informe o e-mail cadastrado para receber o link de redefinição.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('esqueci_senha') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <button type="submit" class="btn-primary">Enviar Link</button>
        </form>

        <p class="auth-footer">
            Lembrou a senha? <a href="{{ url_for('login') }}">Voltar para o login</a>
        </p>
    </div>
</body>
</html>
