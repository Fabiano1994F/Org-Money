<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Org Money</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Splash Screen Overlay */
        #splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
        }

        .splash-logo-img {
            max-width: 200px;
            height: auto;
            border-radius: 16px;
            filter: drop-shadow(0px 0px 20px rgba(0, 247, 255, 0.4));
            animation: pulseLogo 1.5s infinite alternate ease-in-out;
        }

        .splash-spinner {
            width: 35px;
            height: 35px;
            margin: 20px auto 0;
            border: 3px solid rgba(0, 247, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00f7ff;
            animation: spin 0.8s linear infinite;
        }

        /* Estilização do Card e Logo de Login */
        .auth-container {
            position: relative;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 24px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        .auth-top-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-bottom: 10px;
        }

        .auth-top-bar .btn-theme-toggle {
            position: static !important;
            padding: 6px 12px !important;
            font-size: 0.8rem !important;
            width: auto !important;
        }

        .auth-logo {
            max-width: 120px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
            border-radius: 12px;
            filter: drop-shadow(0px 0px 10px rgba(0, 247, 255, 0.2));
        }

        /* Ajuste do campo de Senha + Esqueceu a Senha */
        .label-password-wrapper {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            width: 100% !important;
            margin-bottom: 6px !important;
        }

        .label-password-wrapper label {
            margin-bottom: 0 !important;
            font-weight: 600;
        }

        .forgot-password-link {
            font-size: 0.82rem;
            color: #00f7ff;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulseLogo {
            from {
                transform: scale(0.98);
                filter: drop-shadow(0px 0px 15px rgba(0, 247, 255, 0.3));
            }
            to {
                transform: scale(1.03);
                filter: drop-shadow(0px 0px 25px rgba(0, 247, 255, 0.6));
            }
        }
    </style>

    <!-- Aplicação preventiva do tema escuro para evitar "flicker" -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>

<body class="auth-body">

    <!-- Splash Screen Overlay -->
    <div id="splash-overlay">
        <div class="splash-content">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Org Money Logo" class="splash-logo-img">
            <div class="splash-spinner"></div>
        </div>
    </div>

    <div class="auth-container">
        <!-- Botão de Alternar Tema Organizado no Topo do Card -->
        <div class="auth-top-bar">
            <button id="toggle-theme" class="btn-theme-toggle" type="button">🌙 Modo Escuro</button>
        </div>

        <!-- Logo e Título -->
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Org Money" class="auth-logo">
        <h2 style="text-align: center; margin-bottom: 20px;">🔑 Acessar Sistema</h2>

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Formulário de Login -->
        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <div class="label-password-wrapper">
                    <label for="senha">Senha</label>
                    <a href="{{ url_for('esqueci_senha') }}" class="forgot-password-link">Esqueceu a senha?</a>
                </div>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <p class="auth-footer">
            Ainda não tem uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sincronização da classe dark-mode no body e no html
            if (document.documentElement.classList.contains('dark-mode')) {
                document.body.classList.add('dark-mode');
            }

            // Controle de Texto e Clique do Botão de Tema
            const themeBtn = document.getElementById('toggle-theme');
            if (themeBtn) {
                const isDark = document.body.classList.contains('dark-mode');
                themeBtn.textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';

                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    document.documentElement.classList.toggle('dark-mode');
                    const activeDark = document.body.classList.contains('dark-mode');
                    themeBtn.textContent = activeDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
                    localStorage.setItem('theme', activeDark ? 'dark' : 'light');
                });
            }

            // Controle da Splash Screen (Exibe por 1.8s no primeiro acesso da sessão)
            const splash = document.getElementById('splash-overlay');
            if (splash) {
                if (sessionStorage.getItem('splash_shown')) {
                    splash.style.display = 'none';
                } else {
                    setTimeout(() => {
                        splash.classList.add('hidden');
                        sessionStorage.setItem('splash_shown', 'true');
                    }, 1800);
                }
            }
        });
    </script>
</body>

</html>
